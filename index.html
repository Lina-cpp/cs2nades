<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="icon" type="image/png" href="favi.ico">
  <meta charset="UTF-8">
  <title>CS2 Nades</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>CS2 Nades - v1.3.0</h2>

<div class="container">

  <!-- Maps column -->
  <div class="col maps">
    <ul>
      <br><br><br>
      <li data-map="Home">Home</li> <br>
      <li data-map="Mirage">
        <img class="map-thumb" src="thumbs/mirage.webp" alt="">
        Mirage
      </li>
      <li data-map="Inferno">
        <img class="map-thumb" src="thumbs/inferno.webp" alt="">
        Inferno
      </li>
      <li data-map="Overpass">
        <img class="map-thumb" src="thumbs/overpass.webp" alt="">
        Overpass
      </li>
      <li data-map="Nuke">
        <img class="map-thumb" src="thumbs/nuke.webp" alt="">
        Nuke
      </li>
      <li data-map="Ancient">
        <img class="map-thumb" src="thumbs/ancient.webp" alt="">
        Ancient
      </li>
      <li data-map="Dust2">
        <img class="map-thumb" src="thumbs/dust2.webp" alt="">
        Dust2
      </li>
      <li data-map="Anubis">
        <img class="map-thumb" src="thumbs/anubis.webp" alt="">
        Anubis
      </li>
      <br>
      <li data-map="Komendy">Komendy</li>
    </ul>
  </div>

  <!-- Sidebar: TT/CT + callouts -->
  <div class="col sides">

    <!-- Search -->
    <div class="search-wrap">
      <input id="sidebar-search" type="text" placeholder="🔍 Szukaj..." autocomplete="off">
    </div>

    <!-- Filters -->
    <h3 class="filters-title">Filtry:</h3>
    <div class="filters">
      <button class="filter-btn filter-smoke active" data-type="smoke">Smoke</button>
      <button class="filter-btn filter-molo active" data-type="molo">Molo</button>
      <button class="filter-btn filter-flash active" data-type="flash">Flash</button>
      <button class="filter-btn filter-he active" data-type="he">HE</button>
    </div>

    <!-- Callouts -->
    <h3>Mapa + miejscówki</h3>
    <div class="subside" id="Callouts"></div>

    <!-- TT section with collapse toggle -->
    <div class="side-section" id="section-TT">
      <h3>
        TT
        <button class="section-toggle" title="Zwiń/rozwiń">▾</button>
      </h3>
      <div class="section-body">
        <div class="subside" id="TT"></div>
      </div>
    </div>

    <!-- CT section with collapse toggle -->
    <div class="side-section" id="section-CT">
      <h3>
        CT
        <button class="section-toggle" title="Zwiń/rozwiń">▾</button>
      </h3>
      <div class="section-body">
        <div class="subside" id="CT"></div>
      </div>
    </div>

  </div>

  <!-- Details column -->
  <div class="col details">
  </div>

</div>

<!-- Breadcrumb bar -->
<div id="breadcrumb-bar">
  <div id="breadcrumb"></div>
</div>

<!-- History panel -->
<div id="history-panel">
  <div id="history-header">
    <span>🕐 Ostatnio oglądane</span>
    <button id="history-toggle">▾</button>
  </div>
  <ul id="history-list"></ul>
</div>

<script src="script.js"></script>
<script>
  // History panel toggle
  document.getElementById('history-toggle').addEventListener('click', () => {
    document.getElementById('history-panel').classList.toggle('collapsed');
  });
</script>
</body>
</html>
